[project]
name = "a7-py"
version = "0.3.0"
description = "A compiler for the A7 systems programming language with Zig code generation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
a7 = "a7.cli:main"

[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["a7*"]

[tool.pytest.ini_options]
# Collect only the project's own suite. Without this a bare `pytest` walks the
# whole tree and picks up test files in scratch directories and worktree copies,
# which broke a gate run on 2026-09-18.
testpaths = ["test"]
markers = [
    "zig: builds or runs native code with the Zig toolchain",
    "slow: takes several seconds without Zig",
]

name: Deploy Docs

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: true

      - name: Check docs writing style
        run: python3 scripts/check_docs_style.py

      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Lint docs
        working-directory: site
        run: bun run lint

      - name: Check generated documentation exports
        working-directory: site
        run: bun run check:exports

      - name: Check documentation coverage
        working-directory: site
        run: bun run check:coverage

      - name: Check publishing types
        working-directory: site
        run: bun run typecheck

      - name: Test publishing contracts
        working-directory: site
        run: bun run test

      - name: Build docs
        working-directory: site
        run: bun run build

      - name: Check published links
        working-directory: site
        run: bun run check:links

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
